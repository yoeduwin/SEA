name: Restore shared email constants

on:
  push:
    branches:
      - 'tmp/paic-restore-email-constants'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paic-client-branch-master
          fetch-depth: 0
      - name: Restore exact shared constants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('BACKEND_FIXES.gs')
          s = p.read_text(encoding='utf-8')
          if "const EMAIL_COLORS_" in s or "const ATENCION_NOMBRE_" in s:
              raise SystemExit('shared constants already present')
          anchor = "function escHtml_(value) {"
          if s.count(anchor) != 1:
              raise SystemExit('escHtml anchor mismatch')
          lines = [
              '// ─────────────────────────────────────────────────────────────────────────────',
              '// CORREOS DE REGISTRO SEADB',
              '// Presentación de los correos que dispara el registro de un servicio.',
              '// No alteran el flujo de registro: sólo reacomodan datos que el proceso ya',
              '// produce. No se agregan campos al formulario ni columnas a CLIENTES_MAESTRO.',
              '// ─────────────────────────────────────────────────────────────────────────────',
              '',
              '// Firma de quien da seguimiento desde Atención a Clientes.',
              "const ATENCION_NOMBRE_ = 'Jimmy';",
              '',
              '// Paleta corporativa usada en ambos correos.',
              'const EMAIL_COLORS_ = {',
              "  verdeOscuro: '#123A28',",
              "  verde:       '#1E5A3E',",
              "  verdeClaro:  '#A9CBB8',",
              "  verdeTenue:  '#7FB89A',",
              "  whatsapp:    '#1FA855',",
              "  fondo:       '#F4F6F4',",
              "  panel:       '#F5F8F5',",
              "  borde:       '#E6EBE4',",
              "  bordeSuave:  '#EFF2ED',",
              "  texto:       '#2B322B',",
              "  textoFuerte: '#1E2620',",
              "  textoSuave:  '#6E796E',",
              "  etiqueta:    '#7A857A',",
              "  ambar:       '#C79A2E',",
              "  ambarFondo:  '#FBF7EC',",
              "  ambarTexto:  '#8A5F0C'",
              '};',
              '',
              '/**',
              ' * Escapa texto capturado por el usuario antes de inyectarlo en el HTML del',
              ' * correo, para que un dato con < o & no rompa el maquetado.',
              ' */',
              ''
          ]
          block = '\n'.join(lines)
          p.write_text(s.replace(anchor, block + anchor, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "BACKEND_FIXES.gs"
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'paic-business-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add BACKEND_FIXES.gs
          git commit -m 'fix(paic): restore shared email constants'
          git push origin HEAD:feat/paic-client-branch-master
